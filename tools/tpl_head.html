<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta name="theme-color" content="#0a0f18">
<meta property="og:title" content="{{title}}"><meta property="og:description" content="{{desc}}">
<meta property="og:type" content="article"><meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="{{manifest}}">
<link rel="alternate" hreflang="ru" href="{{alt_ru}}"><link rel="alternate" hreflang="en" href="{{alt_en}}">
<link rel="alternate" hreflang="x-default" href="{{alt_ru}}">
<link rel="apple-touch-icon" href="{{root}}assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0f18'/%3E%3Cpath d='M5 23 L5 11 L13 11 L13 16 L18 16 L18 9 L25 9 L25 21 L28 21' stroke='%23c8703f' stroke-width='2.6' fill='none'/%3E%3C/svg%3E">
{{fonts}}
<style>
/* ============ ТОКЕНЫ ============ */
:root{
  --ink:#0a0f18; --ink-2:#0d141f; --ink-3:#121b28; --abyss:#05080e;
  /* --paper-3 и --paper-4 подняты до контраста 4.5:1 по WCAG AA на фоне --ink */
  --paper:#f0ebe2; --paper-2:rgba(240,235,226,.72); --paper-3:rgba(240,235,226,.62); --paper-4:rgba(240,235,226,.50);
  --accent:#c8703f; --accent-lit:#e08b57; --bronze:#b8912f; --wine:#7a2f3d; --sea:#4f96cf;
  --line:rgba(240,235,226,.11); --line-2:rgba(240,235,226,.2);
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --s1:8px; --s2:16px; --s3:24px; --s4:40px; --s5:64px; --s6:104px; --s7:168px;
  --col:min(100% - 2.5rem, 68ch); --wide:min(100% - 2.5rem, 1180px);
  --e:cubic-bezier(.22,.68,.24,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
body{
  background:var(--ink); color:var(--paper);
  font-family:var(--sans); font-size:clamp(16.5px,1.05vw,18.5px); font-weight:380; line-height:1.72;
  overflow-x:hidden; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
::selection{background:var(--accent);color:var(--abyss)}
img,svg,video,canvas{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(200,112,63,.32);transition:color .2s,border-color .2s}
a:hover,a:focus-visible{color:var(--accent-lit);border-color:var(--accent-lit)}
:focus-visible{outline:2px solid var(--accent-lit);outline-offset:3px;border-radius:2px}

/* ============ ТИПОГРАФИКА ============ */
h1,h2,h3,h4,.serif{font-family:var(--serif);font-weight:600;line-height:1.06;letter-spacing:-.01em}
.eyebrow{font-size:11.5px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;color:var(--bronze)}
.lead{font-family:var(--serif);font-size:clamp(21px,2.5vw,28px);line-height:1.45;font-style:italic;color:var(--paper-2)}
p{margin-bottom:1.5em}
p:last-child{margin-bottom:0}
b,strong{font-weight:650;color:var(--paper)}
.col{width:var(--col);margin-inline:auto}
.wide{width:var(--wide);margin-inline:auto}

/* ============ КАРКАС ============ */
.act{padding:var(--s7) 0 var(--s6);position:relative}
.act-head{width:var(--wide);margin:0 auto var(--s5)}
.act-head h2{font-size:clamp(44px,8.5vw,104px);margin:var(--s3) 0 0}
.act-head h2 .sub{display:block;font-style:italic;color:var(--accent);font-size:.52em;margin-top:.28em;line-height:1.15}
.act-thesis{font-family:var(--serif);font-size:clamp(20px,2.4vw,27px);line-height:1.42;color:var(--paper-2);max-width:34ch;margin-top:var(--s4);font-style:italic}
.rule{height:1px;background:linear-gradient(90deg,var(--line-2),transparent);margin:var(--s3) 0}

/* появление */
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s var(--e),transform .8s var(--e)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.1s}.rv.d2{transition-delay:.2s}

/* ============ ШАПКА ============ */
header{
  position:fixed;top:0;left:0;right:0;z-index:60;
  padding:calc(var(--safe-t) + 10px) clamp(14px,3vw,30px) 10px;
  display:flex;align-items:center;justify-content:space-between;gap:var(--s2);
  background:linear-gradient(180deg,rgba(5,8,14,.9),rgba(5,8,14,.55) 60%,transparent);
  transition:transform .35s var(--e);
}
header.hide{transform:translateY(-120%)}
.brand{font-family:var(--serif);font-size:17px;letter-spacing:.02em;color:var(--paper);border:0;white-space:nowrap}
.brand i{font-style:italic;color:var(--accent)}
.hnav{display:flex;align-items:center;gap:clamp(10px,1.6vw,22px)}
.hnav a{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--paper-3);border:0}
.hnav a:hover{color:var(--accent)}
@media(max-width:900px){.hnav .lnk{display:none}}
.chip{
  border:1px solid var(--line-2);border-radius:999px;padding:7px 14px;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--paper-3);
  min-height:34px;display:inline-flex;align-items:center;gap:6px;transition:all .2s;
}
.chip:hover,.chip:focus-visible{color:var(--paper);border-color:var(--paper-3)}
.chip.act-on{color:var(--accent);border-color:var(--accent)}
/* пальцем нужно 44 px; на десктопе шапка остаётся прежней высоты */
@media(hover:none){.chip{min-height:44px;padding:7px 16px}.brand{padding:6px 0;display:inline-block}}
#bar{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--accent),var(--bronze));z-index:61}

/* ============ ГЕРОЙ ============ */
#hero{min-height:100svh;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;isolation:isolate}
#hero .bg{position:absolute;inset:0;z-index:-2}
#hero video,#hero canvas{width:100%;height:100%;object-fit:cover}
#hero video{opacity:0;transition:opacity 2s}
#hero video.in{opacity:.85}
#hero .veil{position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(5,8,14,.72),rgba(5,8,14,.34) 40%,rgba(5,8,14,.86)),
             radial-gradient(120% 80% at 50% 40%,transparent 40%,rgba(5,8,14,.7))}
#hero .in-col{padding:calc(var(--safe-t) + 96px) 20px calc(var(--safe-b) + 104px);max-width:940px}
#hero h1{font-size:clamp(56px,15vw,168px);line-height:.92;letter-spacing:-.02em}
#hero h1 .l2{display:block;font-style:italic;color:var(--accent)}
#hero .sub{margin:var(--s4) auto 0;max-width:56ch;font-size:clamp(17px,1.9vw,21px);color:var(--paper-2);line-height:1.6}
#hero .facts{margin-top:var(--s4);display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#hero .facts span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--paper-3);border:1px solid var(--line);border-radius:999px;padding:8px 15px}
.scroll-cue{position:absolute;bottom:calc(var(--safe-b) + 22px);left:50%;transform:translateX(-50%);z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:9px;
  font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--paper-3);font-weight:700}
.scroll-cue i{width:1px;height:38px;background:linear-gradient(180deg,var(--accent),transparent);animation:cue 2.4s var(--e) infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ============ КИНОСЦЕНА СО СКРАББИНГОМ ============ */
.scene{position:relative}
.scene .stage{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;place-items:center;isolation:isolate}
.scene video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.scene .grade{position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(5,8,14,.55),rgba(5,8,14,.15) 45%,rgba(5,8,14,.9))}
.scene .bars{position:absolute;left:0;right:0;height:9svh;background:var(--abyss);z-index:1;transform:scaleY(0);will-change:transform}
.scene .bars.t{top:0;transform-origin:top}.scene .bars.b{bottom:0;transform-origin:bottom}
.scene .cap{position:relative;z-index:2;width:min(100% - 3rem,700px);text-align:center;align-self:end;
  padding-bottom:calc(var(--safe-b) + 13vh)}
.scene .cap p{position:absolute;left:0;right:0;bottom:0;opacity:0;transform:translateY(12px);
  transition:opacity .5s,transform .5s;font-family:var(--serif);font-style:italic;
  font-size:clamp(20px,3.4vw,32px);line-height:1.35;margin:0}
.scene .cap p.on{opacity:1;transform:none}
.scene .cap small{display:block;margin-top:12px;font-family:var(--sans);font-style:normal;
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-3);font-weight:700}
.scene .hint{position:absolute;z-index:2;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 74px);
  font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--paper-4);font-weight:700;
  opacity:0;transition:opacity .8s}
.scene .hint.on{opacity:1}
.fallback-still{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center}

/* ============ МЕДИА ПОЛНОЙ ШИРИНЫ ============ */
.bleed{position:relative;margin:var(--s6) 0;width:100%;overflow:hidden}
.bleed figure{margin:0;position:relative;overflow:hidden}
.bleed img{width:100%;height:clamp(320px,64svh,760px);object-fit:cover;transform:scale(1.06);will-change:transform}
.bleed .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,8,14,.5),transparent 30%,transparent 62%,rgba(10,15,24,.95))}
.bleed figcaption{position:absolute;left:0;right:0;bottom:0;padding:var(--s3) 0;pointer-events:none;z-index:6}
.bleed figcaption .inner{width:var(--wide);margin:0 auto;display:flex;justify-content:space-between;gap:var(--s2);flex-wrap:wrap;
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--paper-3)}
.bleed figcaption .cr{color:var(--paper-4)}
.bleed.tall img{height:clamp(420px,88svh,940px)}
.bleed.wide-cine img{height:clamp(240px,52svh,600px)}

/* ============ ЦИТАТА ============ */
blockquote{margin:var(--s6) auto;width:var(--col)}
blockquote p{font-family:var(--serif);font-style:italic;font-size:clamp(26px,4.4vw,46px);line-height:1.24;
  color:var(--paper);margin:0;text-indent:-.4em}
blockquote cite{display:block;margin-top:var(--s3);font-family:var(--sans);font-style:normal;
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-3);font-weight:700}

/* ============ КАРТОЧКА ОПРЕДЕЛЕНИЯ ============ */
.def{width:var(--wide);margin:var(--s6) auto;display:grid;grid-template-columns:auto 1fr;gap:var(--s5);align-items:start}
.def .word{font-family:var(--serif);font-size:clamp(56px,9vw,128px);color:var(--bronze);line-height:.9}
.def .tr{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--paper-3);font-weight:700;margin-top:var(--s2)}
.def .body{max-width:56ch}
.def ul{list-style:none;margin-top:var(--s3);display:grid;gap:9px}
.def li{font-size:14.5px;color:var(--paper-2);padding-left:22px;position:relative}
.def li::before{content:'';position:absolute;left:0;top:.62em;width:11px;height:1px;background:var(--accent)}
@media(max-width:760px){.def{grid-template-columns:1fr;gap:var(--s3)}}

/* ============ ЗАМЕТКА НА ПОЛЯХ ============ */
.aside{width:var(--col);margin:var(--s5) auto;padding-left:var(--s3);border-left:2px solid var(--bronze)}
.aside h4{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--bronze);font-family:var(--sans);font-weight:800;margin-bottom:10px}
.aside p{font-size:15px;color:var(--paper-2)}
.note{width:var(--col);margin:var(--s6) auto;font-family:var(--serif);font-style:italic;
  font-size:clamp(18px,2.1vw,22px);line-height:1.6;color:var(--paper-2)}
.note::before{content:'';display:block;width:38px;height:1px;background:var(--accent);margin-bottom:var(--s3)}
</style>
